<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniStream Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="header">
    <img src="icons/icon32.png" alt="" class="logo">
    <div class="brand">
      <div class="name">OmniStream <span style="opacity:.55;font-weight:600;font-size:10px">v2.4.0</span></div>
      <div class="domain" id="currentDomain">This tab</div>
    </div>
    <div class="theme-select-container">
      <select id="themeSelector" class="theme-dropdown" title="Theme Selector">
        <option value="cyber">Cyber Slate</option>
        <option value="black">Midnight Black</option>
      </select>
    </div>
    <div id="bridgeStatus" class="bridge" title="Desktop app">
      <span class="dot"></span>
    </div>
  </header>

  <div class="mode-row">
    <div class="mode-segmented">
      <button id="modeNormalBtn" type="button" class="mode-tab active" data-mode="normal" title="Normal Mode: Keeps original filename">Normal</button>
      <button id="modeSubMergeBtn" type="button" class="mode-tab" data-mode="sub_merge" title="Sub Merge Mode: Video + Multi-Audio + Subtitles all merged into MKV">Sub Merge</button>
      <button id="modeNetflixBtn" type="button" class="mode-tab" data-mode="netflix_rename" title="Netflix Mode: Auto-identifies ID and renames to official title">Netflix</button>
    </div>
  </div>

  <div class="scan-row">
    <button id="godScanBtn" type="button" class="scan-btn" title="Unlock F12 and scan protected players">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
      <span id="godScanLabel">God Mode scan</span>
    </button>
  </div>

  <section class="panel">
    <div class="panel-head">
      <span>Player</span>
    </div>
    <div id="detectedList" class="list"></div>
  </section>

  <div id="toast" class="toast"></div>
</div>
<script src="popup.js"></script>
</body>
</html>
