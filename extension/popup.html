<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniStream Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="header">
    <img src="icons/icon32.png" alt="" class="logo">
    <div class="brand">
      <div class="name">OmniStream <span style="opacity:.65;font-weight:700;font-size:10px;background:rgba(99,102,241,0.2);padding:1px 5px;border-radius:4px;border:1px solid rgba(99,102,241,0.3)">v2.6.0</span></div>
      <div class="domain" id="currentDomain">This tab</div>
    </div>
    <div class="theme-select-container">
      <select id="themeSelector" class="theme-dropdown" title="Theme Selector">
        <option value="cyber">Cyber Slate</option>
        <option value="black">Midnight Black</option>
      </select>
    </div>
    <div id="bridgeStatus" class="bridge" title="Desktop app">
      <span class="dot"></span>
    </div>
  </header>

  <div class="mode-row">
    <div class="mode-segmented">
      <button id="modeNormalBtn" type="button" class="mode-tab active" data-mode="normal" title="Normal Mode: Keeps original filename">Normal</button>
      <button id="modeTitleOnlyBtn" type="button" class="mode-tab" data-mode="title_only" title="Title Only Mode: Movie Name (Year).mkv or S01E02">Title Only</button>
      <button id="modeImdbBtn" type="button" class="mode-tab" data-mode="imdb_rename" title="IMDb ID Mode: tt1234567.mkv / S01E02 tt1234567.mkv">IMDb ID</button>
      <button id="modeTmdbBtn" type="button" class="mode-tab" data-mode="tmdb_rename" title="TMDB ID Mode: 8273726.mkv / S01E02 8273726.mkv">TMDB ID</button>
      <button id="modeTitleIdBtn" type="button" class="mode-tab" data-mode="title_id" title="Title + ID Mode: Movie Name (Year) tt1234567 8273726.mkv">Title + ID</button>
      <button id="modeSubMergeBtn" type="button" class="mode-tab" data-mode="sub_merge" title="Sub Merge Mode: Video + Multi-Audio + Subtitles all merged into MKV">Sub Merge</button>
    </div>
  </div>

  <div class="scan-row">
    <button id="godScanBtn" type="button" class="scan-btn" title="Unlock F12 and scan protected players">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
      <span id="godScanLabel">God Mode scan</span>
    </button>
    <button id="clearRefreshBtn" type="button" class="refresh-btn" title="Clear old files and reload tab to capture fresh streams">
      <svg class="refresh-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2v6h-6"/>
        <path d="M21 13a9 9 0 1 1-3-7.7L21 8"/>
      </svg>
      <span id="clearRefreshLabel">Clear & Refresh</span>
    </button>
  </div>

  <section class="panel">
    <div class="panel-head">
      <span>Player Streams</span>
      <div style="display:flex;gap:6px;align-items:center;">
        <button id="batchDownloadBtn" type="button" class="text-btn" style="color:#38bdf8;font-weight:600;" title="Send all detected streams to OmniStream queue">Download All</button>
        <button id="clearOnlyBtn" type="button" class="text-btn" title="Clear detected files from list">Clear</button>
      </div>
    </div>
    <div id="detectedList" class="list"></div>
  </section>

  <div id="toast" class="toast"></div>
</div>
<script src="popup.js"></script>
</body>
</html>
